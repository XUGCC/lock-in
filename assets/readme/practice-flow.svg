<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">一次练习如何变成日历轨迹</title>
  <desc id="desc">动作、时长、状态、音乐和笔记保存在手机本地，随后生成日历、统计、历史轨迹，并可导入导出 JSON。</desc>

  <rect width="1200" height="390" rx="26" fill="#FFF9EB"/>
  <rect x="18" y="18" width="1164" height="354" fill="none" stroke="#171714" stroke-width="3"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="48" y="63" fill="#30449E" font-family="Impact, 'Arial Black', sans-serif" font-size="30" letter-spacing="1">ONE SESSION → ONE STAMP</text>
    <text x="1152" y="60" text-anchor="end" fill="#716C62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">LOCAL DATA FLOW</text>

    <g transform="translate(48 96)">
      <rect width="280" height="212" fill="#30449E" stroke="#171714" stroke-width="3"/>
      <text x="20" y="34" fill="#F5CA45" font-size="14" font-weight="900" letter-spacing="2">01 / 记录练习</text>
      <g transform="translate(20 58)" fill="#FFF9EB" font-size="18" font-weight="800">
        <text y="0">动作与自定义元素</text>
        <text y="34">时长与身体状态</text>
        <text y="68">笔记与 BPM</text>
        <text y="102">每天最喜欢的一首歌</text>
      </g>
      <rect x="20" y="174" width="240" height="22" fill="#F5CA45"/>
      <text x="140" y="190" text-anchor="middle" fill="#171714" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="900">SAVE SESSION</text>
    </g>

    <path d="M344 202 H414" fill="none" stroke="#171714" stroke-width="5"/>
    <path d="M404 190 L420 202 L404 214" fill="none" stroke="#171714" stroke-width="5"/>

    <g transform="translate(432 108)">
      <circle cx="112" cy="94" r="94" fill="#171714"/>
      <circle cx="112" cy="94" r="72" fill="none" stroke="#3B3B36" stroke-width="7"/>
      <circle cx="112" cy="94" r="50" fill="none" stroke="#4B4B44" stroke-width="7"/>
      <circle cx="112" cy="94" r="31" fill="#F5CA45" stroke="#FFF9EB" stroke-width="4"/>
      <text x="112" y="92" text-anchor="middle" fill="#171714" font-family="Impact, 'Arial Black', sans-serif" font-size="20">LOCAL</text>
      <text x="112" y="110" text-anchor="middle" fill="#171714" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="900">STORAGE</text>
      <text x="112" y="220" text-anchor="middle" fill="#716C62" font-size="14" font-weight="800">App 本地存储</text>
    </g>

    <path d="M670 202 H740" fill="none" stroke="#171714" stroke-width="5"/>
    <path d="M730 190 L746 202 L730 214" fill="none" stroke="#171714" stroke-width="5"/>

    <g transform="translate(758 96)">
      <rect width="394" height="212" fill="#F2EAD4" stroke="#171714" stroke-width="3"/>
      <text x="20" y="34" fill="#E5482F" font-size="14" font-weight="900" letter-spacing="2">02 / 形成练习轨迹</text>
      <g transform="translate(20 58)">
        <rect width="106" height="62" fill="#FFF9EB" stroke="#171714" stroke-width="2"/>
        <text x="53" y="27" text-anchor="middle" fill="#30449E" font-size="23">▦</text>
        <text x="53" y="48" text-anchor="middle" fill="#171714" font-size="13" font-weight="900">月历打卡</text>

        <rect x="120" width="106" height="62" fill="#F5CA45" stroke="#171714" stroke-width="2"/>
        <text x="173" y="27" text-anchor="middle" fill="#171714" font-size="21">⚡</text>
        <text x="173" y="48" text-anchor="middle" fill="#171714" font-size="13" font-weight="900">连续天数</text>

        <rect x="240" width="106" height="62" fill="#E5482F" stroke="#171714" stroke-width="2"/>
        <text x="293" y="27" text-anchor="middle" fill="#FFF9EB" font-size="22">⌁</text>
        <text x="293" y="48" text-anchor="middle" fill="#FFF9EB" font-size="13" font-weight="900">练习轨迹</text>
      </g>

      <g transform="translate(20 136)">
        <rect width="346" height="48" fill="#171714"/>
        <text x="18" y="30" fill="#FFF9EB" font-size="14" font-weight="800">⇩ JSON 导出</text>
        <path d="M148 24 H202" stroke="#F5CA45" stroke-width="3"/>
        <path d="M194 17 L204 24 L194 31" fill="none" stroke="#F5CA45" stroke-width="3"/>
        <text x="328" y="30" text-anchor="end" fill="#FFF9EB" font-size="14" font-weight="800">⇧ JSON 恢复</text>
      </g>
    </g>

    <text x="48" y="346" fill="#716C62" font-size="14">没有账号系统 · 没有远程数据库 · 数据由你自己备份</text>
    <text x="1152" y="346" text-anchor="end" fill="#30449E" font-size="14" font-weight="900">KEEP THE GROOVE. OWN THE DATA.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">LOCK IN</title>
  <desc id="desc">手机里的 Locking 练习日历，以黑胶唱片、打卡日历和复古舞蹈海报为视觉主题。</desc>
  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="0.8" fill="#171714" opacity="0.10"/>
      <circle cx="14" cy="12" r="0.6" fill="#171714" opacity="0.08"/>
    </pattern>
    <clipPath id="right-panel">
      <rect x="758" y="24" width="418" height="372"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#171714"/>
  <rect x="24" y="24" width="730" height="372" fill="#30449E"/>
  <rect x="758" y="24" width="418" height="372" fill="#FFF9EB"/>
  <rect x="758" y="24" width="418" height="372" fill="url(#paper)"/>
  <rect x="746" y="24" width="12" height="372" fill="#E5482F"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="58" y="66" fill="#F5CA45" font-size="15" font-weight="800" letter-spacing="3">LOCKING PRACTICE / LOCAL-FIRST PWA</text>

    <text x="54" y="194" fill="#171714" opacity="0.75" font-family="Impact, 'Arial Black', sans-serif" font-size="126" letter-spacing="-5">LOCK</text>
    <text x="50" y="188" fill="#FFF9EB" font-family="Impact, 'Arial Black', sans-serif" font-size="126" letter-spacing="-5">LOCK</text>
    <text x="58" y="310" fill="#E5482F" font-family="Impact, 'Arial Black', sans-serif" font-size="126" letter-spacing="-5">IN.</text>
    <text x="50" y="302" fill="#F5CA45" font-family="Impact, 'Arial Black', sans-serif" font-size="126" letter-spacing="-5">IN.</text>

    <g transform="translate(356 106)">
      <text x="0" y="0" fill="#FFF9EB" font-size="34" font-weight="900">把每一次练习</text>
      <text x="0" y="48" fill="#FFF9EB" font-size="34" font-weight="900">压进日历与黑胶</text>
      <line x1="0" y1="76" x2="316" y2="76" stroke="#F5CA45" stroke-width="3"/>
      <text x="0" y="110" fill="#FFF9EB" opacity="0.82" font-size="17">动作 · 时长 · 状态 · 音乐 · 轨迹</text>
    </g>

    <g transform="translate(350 285)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect width="116" height="40" fill="#FFF9EB" stroke="#171714" stroke-width="3"/>
      <text x="58" y="26" text-anchor="middle" fill="#171714" font-size="13" font-weight="800">OFFLINE</text>
      <rect x="126" width="142" height="40" fill="#F5CA45" stroke="#171714" stroke-width="3"/>
      <text x="197" y="26" text-anchor="middle" fill="#171714" font-size="13" font-weight="800">NO BACKEND</text>
      <rect x="278" width="150" height="40" fill="#E5482F" stroke="#171714" stroke-width="3"/>
      <text x="353" y="26" text-anchor="middle" fill="#FFF9EB" font-size="13" font-weight="800">JSON BACKUP</text>
    </g>

    <g clip-path="url(#right-panel)">
      <path d="M1054 8 L1198 8 L1198 184 Z" fill="#F5CA45"/>
      <path d="M1074 8 L1106 8 L1198 184 Z" fill="#E5482F"/>
      <path d="M1138 8 L1174 8 L1198 184 Z" fill="#E5482F"/>
      <path d="M1198 56 L1198 96 L1198 184 Z" fill="#E5482F"/>
    </g>

    <g transform="translate(965 104) rotate(8)">
      <circle r="82" fill="#171714" stroke="#FFF9EB" stroke-width="7"/>
      <circle r="68" fill="none" stroke="#4A4A44" stroke-width="5"/>
      <circle r="55" fill="none" stroke="#34342F" stroke-width="5"/>
      <circle r="42" fill="none" stroke="#4A4A44" stroke-width="5"/>
      <circle r="27" fill="#F5CA45" stroke="#171714" stroke-width="4"/>
      <text x="0" y="7" text-anchor="middle" fill="#171714" font-family="Impact, 'Arial Black', sans-serif" font-size="18">L!</text>
    </g>

    <g transform="translate(790 214)">
      <text x="0" y="0" fill="#171714" font-size="15" font-weight="900" letter-spacing="2">PRACTICE / JUL</text>
      <text x="354" y="0" text-anchor="end" fill="#E5482F" font-size="14" font-weight="900">07 / 18</text>
      <g transform="translate(0 18)" stroke="#171714" stroke-width="2">
        <rect width="48" height="52" fill="#FFF9EB"/>
        <rect x="51" width="48" height="52" fill="#FFF9EB"/>
        <rect x="102" width="48" height="52" fill="#FFF9EB"/>
        <rect x="153" width="48" height="52" fill="#FFF9EB"/>
        <rect x="204" width="48" height="52" fill="#FFF9EB"/>
        <rect x="255" width="48" height="52" fill="#FFF9EB"/>
        <rect x="306" width="48" height="52" fill="#FFF9EB"/>
        <rect y="55" width="48" height="52" fill="#FFF9EB"/>
        <rect x="51" y="55" width="48" height="52" fill="#FFF9EB"/>
        <rect x="102" y="55" width="48" height="52" fill="#F5CA45"/>
        <rect x="153" y="55" width="48" height="52" fill="#FFF9EB"/>
        <rect x="204" y="55" width="48" height="52" fill="#FFF9EB"/>
        <rect x="255" y="55" width="48" height="52" fill="#E5482F"/>
        <rect x="306" y="55" width="48" height="52" fill="#FFF9EB"/>
      </g>
      <g transform="translate(126 96)">
        <circle r="17" fill="#171714"/>
        <circle r="6" fill="#E5482F"/>
      </g>
      <g transform="translate(279 96)">
        <circle r="17" fill="#171714"/>
        <circle r="6" fill="#F5CA45"/>
      </g>
      <g transform="translate(0 143)">
        <circle cx="17" cy="17" r="17" fill="#171714"/>
        <text x="17" y="22" text-anchor="middle" fill="#F5CA45" font-size="15">⚡</text>
        <text x="48" y="22" fill="#171714" font-family="Impact, 'Arial Black', sans-serif" font-size="24">12 STREAK</text>
        <text x="354" y="22" text-anchor="end" fill="#30449E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="800">KEEP THE GROOVE</text>
      </g>
    </g>
  </g>
</svg>
